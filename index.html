<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdReward USDT</title>
</head>
<style>
    body { font-family: sans-serif; background: #130f26; color: #fff; padding: 20px; }
    .card { background: #1e183b; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
    .balance-title { font-size: 13px; color: #aaa; }
    .balance-amount { font-size: 36px; font-weight: bold; margin: 10px 0; }
    button { width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-watch { background: #fffff; color: #130f26; }
    .btn-withdraw { background: #2c2452; color: #00ffcc; border: 1px solid #00ffcc; }
    .stats { display: flex; justify-content: space-between; margin-top: 15px; }
    .stats b { color: #ffffff; }
    .ref-card { background: #1e183b; border-radius: 10px; padding: 15px; }
    .ref-title { font-size: 14px; font-weight: bold; }
    .ref-ops { color: #aaa; font-size: 12px; margin-top: 5px; }
    .btn-copy { background: #00ffcc; color: #130f26; margin-top: 15px; }
    .ads-list { margin-top: 20px; }
    .ad-item { background: #1e183b; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .ad-info { font-size: 14px; }
    .ad-reward { color: #00ffcc; font-weight: bold; }
    .btn-watch-ad { background: #2c2452; color: #fff; padding: 6px 12px; border-radius: 5px; font-size: 12px; }
    .tabs { display: flex; justify-content: space-around; position: fixed; bottom: 0; left: 0; right: 0; background: #1e183b; padding: 10px; border-top: 1px solid #33f; }
    .tab-btn { background: none; color: #bbb; font-size: 12px; cursor: pointer; }
    .tab-btn.active { color: #00ffcc; font-weight: bold; }
    .hidden { display: none; }
    .withdraw-history { margin-top: 20px; background: #1e183b; padding: 15px; border-radius: 10px; }
    .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #332f4a; font-size: 14px; }
    .status-completed { color: #00ffcc; }
    .status-pending { color: #ffaa00; }
</style>
<body>

<div id="main-app">
    <div class="card">
        <div class="balance-title">الرصيد المتاح (USDT)</div>
        <div class="balance-amount" id="user-balance">Loading...</div>
        <button class="btn-withdraw" onclick="showSection('withdraw-section')">سحب الأرباح</button>
    </div>

    <div class="ads-list">
        <h3>شاهد الإعلانات لكسب USDT</h3>
        <div id="ads-container"></div>
    </div>
</div>

<div id="promote-section" class="hidden">
    <h3>ترويج القنوات والبوتات</h3>
    <div class="card">
        <input type="text" id="channel-link" placeholder="رابط القناة أو البوت" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none;">
        <button class="btn-watch" onclick="submitChannel()">إضافة القناة</button>
    </div>
    <div class="ads-list" id="promoted-channels"></div>
</div>

<div id="friends-section" class="hidden">
    <h3>دعوة الأصدقاء</h3>
    <div class="ref-card">
        <div class="ref-title">اربح مكافأة عن كل صديق</div>
        <div class="ref-ops">شارك رابط الإحالة الخاص بك واكسب نسبة من أرباحهم</div>
        <div style="background: #2c2452; padding: 10px; border-radius: 5px; margin: 15px 0; font-size: 12px; word-break: break-all;" id="ref-link">กำลังโหลด...</div>
        <button class="btn-copy" onclick="copyRefLink()">نسخ الرابط</button>
    </div>
</div>

<div id="withdraw-section" class="hidden">
    <h3>سجل المعاملات والسحب</h3>
    <div class="card">
        <input type="number" id="withdraw-amount" placeholder="المبلغ المراد سحبه (USDT)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none;">
        <input type="text" id="wallet-address" placeholder="عنوان محفظة USDT (TRC20)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none;">
        <button class="btn-watch" onclick="submitWithdraw()">تأكيد السحب</button>
    </div>
    
    <div class="withdraw-history">
        <h4>سجل السحب الشفاف</h4>
        <div id="history-container"></div>
    </div>
    <button class="btn-withdraw" style="margin-top: 10px;" onclick="showSection('main-app')">العودة للرئيسية</button>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="showSection('main-app')">الرئيسية</button>
    <button class="tab-btn" onclick="showSection('promote-section')">الترويج</button>
    <button class="tab-btn" onclick="showSection('friends-section')">الأصدقاء</button>
    <button class="tab-btn" onclick="showSection('withdraw-section')">السحب</button>
</div>

<script>
    const BACKEND_URL = 'https://my-ad-bot-nz8i.onrender.com';
    let userId = 'user_' + Math.floor(Math.random()*1000000); 

    async function fetchData(endpoint, options = {}) {
        try {
            const res = await fetch(BACKEND_URL + endpoint, options);
            if (!res.ok) throw new Error('Network response was not ok');
            return await res.json();
        } catch (error) {
            console.error('Fetch error:', error);
            return null;
        }
    }

    async function loadUserData() {
        const data = await fetchData(`/api/user?id=${userId}`);
        document.getElementById('user-balance').innerText = data ? data.balance.toFixed(2) : '0.00';
        document.getElementById('ref-link').innerText = `${window.location.origin}?ref=${userId}`;
    }

    async function loadAds() {
        const ads = await fetchData('/api/ads');
        const container = document.getElementById('ads-container');
        container.innerHTML = '';
        if (ads && ads.length > 0) {
            ads.forEach(ad => {
                container.innerHTML += `
                    <div class="ad-item">
                        <div class="ad-info">
                            <div>${ad.title}</div>
                            <div class="ad-reward">+${ad.reward} USDT</div>
                        </div>
                        <button class="btn-watch-ad" onclick="watchAd('${ad.id}', '${ad.url}', ${ad.reward})">مشاهدة</button>
                    </div>
                `;
            });
        } else {
            container.innerHTML = '<div>لا توجد إعلانات متاحة حالياً</div>';
        }
    }

    async function watchAd(adId, adUrl, reward) {
        window.open(adUrl, '_blank');
        await fetchData('/api/complete-ad', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({userId, adId, reward})
        });
        loadUserData();
        loadAds();
    }

    async function loadPromotedChannels() {
        const channels = await fetchData('/api/channels');
        const container = document.getElementById('promoted-channels');
        container.innerHTML = '';
        if (channels && channels.length > 0) {
            channels.forEach(ch => {
                container.innerHTML += `
                    <div class="ad-item">
                        <div class="ad-info">${ch.name}</div>
                        <button class="btn-watch-ad" onclick="window.open('${ch.url}', '_blank')">زيارة</button>
                    </div>
                `;
            });
        }
    }

    async function submitChannel() {
        const url = document.getElementById('channel-link').value;
        if(!url) return alert('يرجى إدخال الرابط');
        await fetchData('/api/add-channel', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: 'قناة معلن', url, advertiserId: userId})
        });
        alert('تمت إضافة القناة بنجاح');
        document.getElementById('channel-link').value = '';
        loadPromotedChannels();
    }

    async function loadWithdrawHistory() {
        const history = await fetchData(`/api/withdraw-history?id=${userId}`);
        const container = document.getElementById('history-container');
        container.innerHTML = '';
        if (history && history.length > 0) {
            history.forEach(item => {
                container.innerHTML += `
                    <div class="history-item">
                        <span>${item.amount} USDT - ${item.wallet}</span>
                        <span class="status-${item.status}">${item.status === 'completed' ? 'مكتملة' : 'قيد المراجعة'}</span>
                    </div>
                `;
            });
        } else {
            container.innerHTML = '<div>لا توجد عمليات سحب سابقة</div>';
        }
    }

    async function submitWithdraw() {
        const amount = parseFloat(document.getElementById('withdraw-amount').value);
        const wallet = document.getElementById('wallet-address').value;
        if(isNaN(amount) || amount <= 0 || !wallet) return alert('يرجى إدخال بيانات صحيحة');
        
        const res = await fetchData('/api/withdraw', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({userId, amount, wallet})
        });
        if(res && res.success) {
            alert('تم تقديم طلب السحب بنجاح');
            document.getElementById('withdraw-amount').value = '';
            document.getElementById('wallet-address').value = '';
            loadUserData();
            loadWithdrawHistory();
        } else {
            alert(res ? res.message : 'فشل الطلب');
        }
    }

    function copyRefLink() {
        const text = document.getElementById('ref-link').innerText;
        navigator.clipboard.writeText(text);
        alert('تم نسخ الرابط');
    }

    function showSection(sectionId) {
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('promote-section').classList.add('hidden');
        document.getElementById('friends-section').classList.add('hidden');
        document.getElementById('withdraw-section').classList.add('hidden');
        document.getElementById(sectionId).classList.remove('hidden');
        
        if(sectionId === 'withdraw-section') loadWithdrawHistory();
    }

    window.onload = () => {
        loadUserData();
        loadAds();
        loadPromotedChannels();
    };
</script>

</body>
</html>
